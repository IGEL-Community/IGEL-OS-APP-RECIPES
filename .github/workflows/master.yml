name: MasterDeployAPP

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

concurrency:
  group: master-deploy-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Create APP packages
        run: bash utils/make-app-packages.sh

      - name: Commit and push APP packages
        run: |
          git config user.name "rneher-igel"
          git config user.email "neher@igel.com"

          git add --all

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Updated APP Packages"

          echo "Fetching latest remote changes..."
          git fetch origin main

          echo "Rebasing onto latest main..."
          git rebase origin/main

          echo "Pushing changes..."
          git push origin HEAD:main
